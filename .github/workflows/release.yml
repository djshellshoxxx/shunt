name: release

# RS-05: desktop builds for Windows, Linux x64 and aarch64, macOS universal; the Box
# image; GitHub release on v* tags; macOS signing and notarisation when secrets exist.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  JUCE_LINUX_DEPS: >-
    ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev
    libxrender-dev libgl1-mesa-dev

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSHUNT_REQUIRE_LICENCE=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(Shunt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p dist/Shunt
          cp "$(find build/app/desktop -name Shunt.exe -path '*Release*' | head -1)" dist/Shunt/
          cp "$(find build/app/headless -name shunt_headless.exe | head -1)" dist/Shunt/
          cp build/tools/Release/shunt_cli.exe build/tools/Release/shuntsim.exe dist/Shunt/
          python -m pip install pillow
          python -c "from PIL import Image; Image.open('assets/icon-512.png').save('dist/Shunt/shunt.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"
          cp LEGAL.md dist/Shunt/LEGAL.txt
          cp docs/WINDOWS.md dist/Shunt/README.txt
          (cd dist && 7z a "Shunt-$VERSION-windows-x64-portable.zip" Shunt)
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION=$VERSION -DSRCDIR="$PWD/dist/Shunt" \
            -DOUTFILE="$PWD/dist/Shunt-$VERSION-windows-x64-setup.exe" installer/windows/shunt.nsi
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*.*" }

  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $JUCE_LINUX_DEPS
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHUNT_REQUIRE_LICENCE=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          VERSION=$(sed -n 's/^project(Shunt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          D=dist/shunt-$VERSION-linux-${{ matrix.arch }}
          mkdir -p $D
          cp "$(find build/app/desktop -type f -name Shunt -perm -u+x | head -1)" $D/
          cp "$(find build/app/headless -type f -name shunt_headless -perm -u+x | head -1)" $D/
          cp build/tools/shunt_cli build/tools/shuntsim LEGAL.md README.md $D/
          tar -C dist -czf dist/shunt-$VERSION-linux-${{ matrix.arch }}.tar.gz shunt-$VERSION-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with: { name: "linux-${{ matrix.arch }}", path: "dist/*.tar.gz" }

  macos:
    runs-on: macos-14
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DSHUNT_REQUIRE_LICENCE=ON
          cmake --build build --config Release -- -quiet
          ctest --test-dir build -C Release --output-on-failure -E shuntsim_localhost
      - name: Sign and notarise
        if: ${{ env.MACOS_CERT_P12 != '' && startsWith(github.ref, 'refs/tags/v') }}
        run: scripts/macos-sign-notarise.sh "$(find build/app/desktop -name Shunt.app -path '*Release*' | head -1)"
      - name: Package
        run: |
          VERSION=$(sed -n 's/^project(Shunt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          APP="$(find build/app/desktop -name Shunt.app -path '*Release*' | head -1)"
          mkdir -p dist/dmg && cp -R "$APP" dist/dmg/ && cp LEGAL.md dist/dmg/
          hdiutil create -volname Shunt -srcfolder dist/dmg -ov -format UDZO dist/Shunt-$VERSION-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "dist/*.dmg" }

  box-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build Shunt Box image
        run: sudo appliance/build-image.sh dist
      - uses: actions/upload-artifact@v4
        with: { name: box-image, path: "dist/*.img.xz*" }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, box-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
